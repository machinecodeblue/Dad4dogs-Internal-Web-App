{% if dog.vaccination_status == 'expiring' %}
<span class="badge badge-warn">VAX {{ dog.current_vaccination_expires_at|date:"M j" }}</span>
{% elif dog.vaccination_status == 'expired' %}
<span class="badge badge-danger">VAX EXPIRED</span>
{% elif dog.vaccination_status == 'missing' %}
<span class="badge badge-warn">NO VAX</span>
{% endif %}
